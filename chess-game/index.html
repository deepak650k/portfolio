<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grandmaster Chess | Blue - Black Edition</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♞</text></svg>">
</head>
<body>

  <!-- Top App Navigation -->
  <header class="app-header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2l4 4L7 17l-4 4 4-4L14 2z"/>
        <path d="M3 21l3-3"/>
        <path d="M15 7l2 2"/>
      </svg>
      <h1>GRANDMASTER CHESS</h1>
    </div>

    <div class="header-status">
      <div class="turn-pill">
        <span class="turn-dot" id="turnDot"></span>
        <span id="turnText">White's Turn</span>
      </div>
      <button class="btn-icon" id="muteBtn" title="Toggle Sound">
        <span id="soundIcon">🔊</span>
      </button>
    </div>
  </header>

  <!-- Main Playing Arena -->
  <main class="main-arena">
    <!-- Left: Chessboard & Player Info -->
    <section class="board-section">
      <!-- Top Player Pod (Black by default) -->
      <div class="player-pod" id="topPlayerPod">
        <div class="player-info">
          <div class="player-avatar black" id="topAvatar">AI</div>
          <div class="player-meta">
            <span class="player-name" id="topPlayerName">Computer (MEDIUM)</span>
            <div class="captured-tray" id="topCaptured"></div>
          </div>
        </div>
        <div class="player-timer" id="topTimer">∞</div>
      </div>

      <!-- Chessboard Grid -->
      <div class="board-container">
        <div class="chessboard" id="chessboard"></div>
      </div>

      <!-- Bottom Player Pod (White by default) -->
      <div class="player-pod" id="bottomPlayerPod">
        <div class="player-info">
          <div class="player-avatar white" id="bottomAvatar">YOU</div>
          <div class="player-meta">
            <span class="player-name" id="bottomPlayerName">You (White)</span>
            <div class="captured-tray" id="bottomCaptured"></div>
          </div>
        </div>
        <div class="player-timer" id="bottomTimer">∞</div>
      </div>
    </section>

    <!-- Right: Match Controls & Move History -->
    <aside class="control-panel">
      <!-- Game Mode & Settings Card -->
      <div class="panel-card">
        <div class="panel-card-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          Game Settings
        </div>

        <!-- Mode Select -->
        <div class="setting-group">
          <label class="setting-label">Game Mode</label>
          <div class="segmented-control">
            <button class="seg-btn active" data-mode="ai">Vs Computer</button>
            <button class="seg-btn" data-mode="pvp">Pass & Play</button>
          </div>
        </div>

        <!-- AI Settings Container -->
        <div id="aiSettingsGroup" style="display: flex; flex-direction: column; gap: 10px;">
          <!-- AI Difficulty -->
          <div class="setting-group">
            <label class="setting-label">AI Difficulty</label>
            <div class="segmented-control">
              <button class="seg-btn" data-difficulty="easy">Easy</button>
              <button class="seg-btn active" data-difficulty="medium">Medium</button>
              <button class="seg-btn" data-difficulty="hard">Hard</button>
            </div>
          </div>

          <!-- Color Selector -->
          <div class="setting-group">
            <label class="setting-label">Play As</label>
            <div class="segmented-control">
              <button class="seg-btn active" data-color="w">White</button>
              <button class="seg-btn" data-color="random">Random</button>
              <button class="seg-btn" data-color="b">Black</button>
            </div>
          </div>
        </div>

        <!-- Time Control -->
        <div class="setting-group" style="margin-top: 10px;">
          <label class="setting-label">Clock Timer</label>
          <div class="segmented-control">
            <button class="seg-btn active" data-time="none">Casual</button>
            <button class="seg-btn" data-time="300">5 Min</button>
            <button class="seg-btn" data-time="600">10 Min</button>
            <button class="seg-btn" data-time="900">15 Min</button>
          </div>
        </div>
      </div>

      <!-- Move History Card -->
      <div class="panel-card">
        <div class="panel-card-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          Move History
        </div>
        <div class="history-container" id="historyContainer">
          <table class="history-table">
            <thead>
              <tr>
                <th style="width: 40px;">#</th>
                <th>White</th>
                <th>Black</th>
              </tr>
            </thead>
            <tbody id="historyList"></tbody>
          </table>
        </div>

        <!-- Action Buttons -->
        <div class="actions-grid">
          <button class="btn-secondary" id="undoBtn" title="Undo Move (⌘Z)">
            <span>↩</span> Undo
          </button>
          <button class="btn-secondary" id="flipBtn" title="Flip Board (F)">
            <span>🔄</span> Flip
          </button>
          <button class="btn-secondary" id="exportPgnBtn" title="Copy PGN Notation">
            <span>📋</span> PGN
          </button>
          <button class="btn-primary" id="newGameBtn">
            <span>⚡</span> New Game
          </button>
        </div>
      </div>
    </aside>
  </main>

  <!-- Pawn Promotion Modal -->
  <div class="modal-overlay" id="promoModal">
    <div class="modal-dialog">
      <h2 class="modal-title">Promote Pawn</h2>
      <p class="modal-subtitle">Choose a piece to replace your pawn:</p>
      <div class="promotion-options" id="promotionOptions"></div>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div class="modal-overlay" id="gameOverModal">
    <div class="modal-dialog">
      <h2 class="modal-title" id="gameOverTitle">Checkmate!</h2>
      <p class="modal-subtitle" id="gameOverSubtitle">White delivered checkmate.</p>
      <div style="display: flex; gap: 12px; justify-content: center; margin-top: 24px;">
        <button class="btn-secondary" id="closeGameOverBtn">Review Board</button>
        <button class="btn-primary" id="playAgainBtn">Play Again</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Chess Logic & Application Scripts -->
  <script src="pieces.js"></script>
  <script src="engine.js"></script>
  <script src="ai.js"></script>
  <script src="sound.js"></script>
  <script src="app.js"></script>
</body>
</html>
